<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Collection - M.Suhaib Watches</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">M.Suhaib Watches</div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="men.html">Men</a>
            <a href="women.html" class="active">Women</a>
            <a href="kids.html">Kids</a>
        </nav>
    </header>

    <section class="hero" style="padding: 50px 20px;">
        <h1>Women's Collection</h1>
        <p>Elegant and sophisticated designs for women.</p>
    </section>

    <section class="collections-section">
        <h2>Available Women's Watches</h2>
        <div id="women-watches-container" class="category-grid">
            <p style="color: #666;">Loading watches from database...</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 M.Suhaib Watches. All Rights Reserved.</p>
    </footer>

    <script>
    async function loadWomenWatches() {
        try {
            const res = await fetch('http://localhost:3000/api/watches?category=women');
            const watches = await res.json();
            const container = document.getElementById('women-watches-container'); // Agar id alag ho toh match kar lena

            if (!container) return;

            if (watches.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center; width: 100%;">No women watches available right now.</p>';
                return;
            }

            container.innerHTML = '';
            watches.forEach(watch => {
                container.innerHTML += `
                    <div class="category-card" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center;">
                        <img src="http://localhost:3000${watch.image}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 15px;" alt="watch">
                        <h3>${watch.name}</h3>
                        <p style="color: #e67e22; font-weight: bold; font-size: 18px; margin: 10px 0;">Rs ${watch.price}</p>
                        <button onclick="alert('Order on WhatsApp feature coming soon!')" style="background-color: #f39c12; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;">Buy Now</button>
                    </div>
                `;
            });
        } catch (err) {
            console.error("Error loading watches:", err);
        }
    }

    loadWomenWatches();
</script>

</body>
</html>
