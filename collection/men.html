<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Collection - M.Suhaib Watches</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">M.Suhaib Watches</div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="men.html" class="active">Men</a>
            <a href="women.html">Women</a>
            <a href="kids.html">Kids</a>
        </nav>
    </header>

    <!-- Page Title -->
    <section class="hero" style="padding: 50px 20px;">
        <h1>Men's Collection</h1>
        <p>Explore rugged and classy timepieces for men.</p>
    </section>

    <!-- Watches Display Container -->
    <section class="collections-section">
        <h2>Available Men's Watches</h2>
        <div id="men-watches-container" class="category-grid">
            <!-- Database se watches yahan automatically show hongi -->
            <p style="color: #666;">Loading watches from database...</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 M.Suhaib Watches. All Rights Reserved.</p>
    </footer>

    <script>
    async function loadMenWatches() {
        try {
            const res = await fetch('http://localhost:3000/api/watches?category=men');
            const watches = await res.json();
            const container = document.getElementById('men-watches-container');

            if (watches.length === 0) {
                container.innerHTML = '<p style="color: #666;">No men watches available right now.</p>';
                return;
            }

            container.innerHTML = '';
            watches.forEach(watch => {
                container.innerHTML += `
                    <div class="category-card" style="cursor: default;">
                        <img src="http://localhost:3000${watch.image}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 15px;" alt="watch">
                        <h3>${watch.name}</h3>
                        <p style="color: #e67e22; font-weight: bold; font-size: 18px;">Rs ${watch.price}</p>
                        <button onclick="alert('Order on WhatsApp feature coming soon!')" style="margin-top: 10px; width: 100%;">Buy Now</button>
                    </div>
                `;
            });
        } catch (err) {
            console.error("Error loading watches:", err);
            document.getElementById('men-watches-container').innerHTML = '<p style="color: red;">Failed to load watches from server.</p>';
        }
    }

    loadMenWatches();
</script>

</body>
</html>
