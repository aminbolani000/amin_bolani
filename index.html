<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Suhaib Watches - Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <h1>M.Suhaib Watches</h1>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids Boys</a>
            <a href="#">Kids Girls</a>
            <a href="#" id="admin-link">Admin Panel</a>
        </nav>
    </header>

    <!-- Main Hero Section -->
    <main>
        <section class="hero">
            <h2>Welcome to M.Suhaib Watches</h2>
            <p>Explore the best collection of luxury and fancy watches.</p>
            <button id="shop-btn">Explore Collections</button>
        </section>

        <!-- Products Section (Yahan watches dikhengi) -->
        <section class="products-container">
            <h3>Featured Watches</h3>
            <div id="product-list" class="grid">
                <!-- Products dynamically yahan aayenge baad mein -->
                <div class="card">
                    <h4>Classic Men Watch</h4>
                    <p>Price: $120</p>
                    <button>Buy Now</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
